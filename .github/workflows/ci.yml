name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The compute kernels are real-only: `rustllama-kernels-sycl` needs Intel
  # oneAPI (icx/icpx) and `rustllama-kernels-cuda` needs the CUDA Toolkit
  # (nvcc), so the GPU-dependent crates (models, engine, server, cli, app,
  # tuner — and safetensors/rag/client/lsp which pull them) can't build on a
  # plain runner. This job checks/tests the crates with NO GPU-toolchain
  # dependency; `cargo fmt` still covers every crate. The GPU-dependent crates
  # are validated by the `gpu-tests` job below (the scripts/Dockerfile.linux-gpu
  # image, which carries both toolchains) and on a Windows box with oneAPI +
  # the CUDA Toolkit installed.
  cargo-check:
    runs-on: windows-latest
    env:
      # The crates with no transitive kernels-sycl / kernels-cuda dep.
      FREE_CRATES: >-
        -p rustllama-config -p rustllama-tensor -p rustllama-tokenizer
        -p rustllama-gguf -p rustllama-kernels-cpu -p rustllama-l0-sys
        -p rustllama-runtime -p rustllama-hub -p rustllama-npu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (all crates)
        run: cargo fmt --all -- --check
      - name: cargo check (toolchain-free crates)
        run: cargo check ${{ env.FREE_CRATES }}
      # Clippy runs informationally (does not fail CI). The free crates still
      # carry ~386 lints, the bulk of them `clippy::needless_range_loop` and
      # manual bit-ops in the bit-exact SIMD / quant kernels (kernels-cpu,
      # gguf) where the indexed form is deliberate and rewriting it would risk
      # the parity guarantees. Turn this into a gate (`-- -D warnings`) once the
      # numeric crates are either cleaned up or carry crate-level `#![allow]`s
      # for the intentional lint families.
      - name: cargo clippy (toolchain-free crates)
        run: cargo clippy --all-targets ${{ env.FREE_CRATES }}
      # `--tests` runs the integration suites under each crate's tests/ dir
      # (e.g. gguf's 4 + tokenizer's 6 + the pretokenizer fixtures) alongside
      # the lib unit tests, which plain `--lib` skipped.
      - name: cargo test (toolchain-free crates)
        run: cargo test --tests --lib ${{ env.FREE_CRATES }}

  # GPU-toolchain crates: models / engine / server / tuner / cli (incl. the
  # server/tests/*.rs HTTP e2e suites). These pull kernels-sycl + kernels-cuda,
  # so they need Intel oneAPI (icx/icpx) AND the CUDA Toolkit (nvcc) to build —
  # which the scripts/Dockerfile.linux-gpu image carries. The job builds that
  # image (the same one the scripts\build-linux-gpu-docker.bat wrapper uses) and
  # runs the suites inside it, mirroring scripts/build.sh's env (source oneAPI
  # setvars; CUDA_PATH/PATH come from the image). COMPILING + running the CPU/
  # host-reachable tests validates here; the GPU kernels themselves only execute
  # on a box with a physical NVIDIA/Intel GPU, so device parity still runs via
  # `doctor --{sycl,cuda,metal}-parity` on real hardware.
  #
  # continue-on-error: this job's definition is authored write-blind (it could
  # not be executed in this environment); its FIRST real CI run validates the
  # image build + test invocation. Flip to a gate (remove continue-on-error)
  # once it has gone green on CI at least once. Note: the image bundles CUDA +
  # oneAPI + OpenVINO (several GB) — a self-hosted runner with adequate disk is
  # the intended long-term home; ubuntu-latest is used here as the default.
  gpu-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: build the Rocky 10 base image
        run: docker build -t rustllama-build-linux -f scripts/Dockerfile.linux scripts
      - name: build the GPU toolchain image (+ CUDA nvcc + Intel oneAPI icx)
        run: docker build -t rustllama-build-gpu -f scripts/Dockerfile.linux-gpu scripts
      - name: cargo test (GPU-toolchain crates, in the GPU image)
        run: |
          docker run --rm -v "$PWD:/work" -w /work rustllama-build-gpu bash -c '
            set -e
            # Source Intel oneAPI setvars (icx/icpx on PATH + SYCL env), exactly
            # as scripts/build.sh does; CUDA_PATH + PATH are set by the image.
            if [ -f /opt/intel/oneapi/setvars.sh ]; then
              set +u; . /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true; set -u
            fi
            cargo test \
              -p rustllama-models -p rustllama-engine -p rustllama-server \
              -p rustllama-tuner -p rustllama-cli
          '
