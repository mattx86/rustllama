[package]
name = "rustllama-tuner"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Autotuner for SYCL kernels, hybrid placement, and CPU threads."

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustllama-tensor = { path = "../rustllama-tensor" }
rustllama-runtime = { path = "../rustllama-runtime" }
# Used by `fingerprint_device` to probe the live SYCL device. Default
# features off to keep the encoder/IQ tables out of this crate; the
# SYCL backend is always compiled, and `fingerprint_device` returns
# None when no SYCL device is present.
rustllama-kernels-sycl = { path = "../rustllama-kernels-sycl", default-features = false }
# Enumerate NVIDIA GPUs for the whole-SYSTEM placement fingerprint (device
# UUIDs of every GPU, not just the single SYCL device). Inert on non-NVIDIA
# hosts (`device_count()` returns 0).
rustllama-kernels-cuda = { path = "../rustllama-kernels-cuda" }
