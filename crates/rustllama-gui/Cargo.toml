[package]
name = "rustllama-gui"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native egui/eframe desktop GUI for rustllama (drives the server over HTTP)."

[dependencies]
# egui stack. Pin the whole family to the SAME 0.29 minor — a mismatch
# (e.g. egui 0.29 + egui_commonmark built against 0.28) is a hard type
# error at the CommonMarkViewer::show boundary. eframe with
# default-features off + an explicit renderer keeps the dep graph lean;
# `wayland`/`x11` are no-ops on Windows (winit gates those deps to unix)
# so this exact feature set still checks on the Windows dev box.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["syntect"] }
egui_commonmark = "0.18"
# Live sparkline charts on the Status view (tok/s, ctx-used, pending). Pinned to
# the same 0.29 minor as the rest of the egui family — a mismatch is a hard type
# error at the Plot/Ui boundary.
egui_plot = "0.29"

# Native OS file dialog (the Models view's "Load from file…" GGUF picker).
# Pure-Rust/platform-native, no toolchain deps — keeps the crate toolchain-free.
rfd = "0.15"

# The reqwest-only HTTP client — the surface for chat / models / decide /
# history. Depending on -client (not -engine/-models/-server/-kernels-*) is
# what keeps this crate TOOLCHAIN-FREE: it builds with plain `cargo`, no
# oneAPI/CUDA env.
rustllama-client = { path = "../rustllama-client" }

# In-process quantize (the Quantize view runs the encode pipeline directly on
# a worker thread, mirroring the old Tauri `quantize_model` command). `-gguf` is
# ALSO toolchain-free — pure Rust GGUF read/write + quant encode, no
# oneAPI/CUDA — so pulling it in keeps this crate buildable with plain `cargo`.
# `encoder` (the default feature) gates the quantize/apex/recipe modules.
rustllama-gguf = { path = "../rustllama-gguf", default-features = false, features = ["encoder"] }

# base64-encode attached images into `data:` URIs for the chat composer's
# multimodal `image_url` content blocks. Pure Rust, toolchain-free.
base64.workspace = true

# Async bridge: a multi-thread tokio runtime owns the network calls; the
# UI thread never blocks. `tokio.workspace` carries the `full` feature set
# (superset of rt-multi-thread/macros/sync/time).
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
