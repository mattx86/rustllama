[package]
name = "rustllama-npu"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Backend-agnostic NPU device model: enumeration, disable-by-index, fingerprint. Vendor runtimes (Intel OpenVINO / AMD Ryzen AI) plug in behind features."

[dependencies]
serde = { workspace = true }
tracing.workspace = true
# Runtime loader for the AMD XRT NPU runtime under `npu-ryzenai` (src/ryzenai.rs
# dlopen's xrt_coreutil, mirroring how rustllama-l0-sys loads ze_loader). Optional
# + feature-gated, so the default build pulls nothing.
libloading = { version = "0.8", optional = true }

[features]
default = []
# Intel NPU via the OpenVINO C API (Apache-2.0). REAL enumeration FFI
# (src/openvino.rs); build.rs links `openvino_c` from the SDK located via
# OPENVINO_DIR / INTEL_OPENVINO_DIR. Off by default so the normal build needs no
# SDK and stays toolchain-free. The offload/inference FFI lands with op-offload.
npu-openvino = []
# AMD NPU via the Ryzen AI / XRT stack. Enumerates by runtime-loading XRT
# (`xrt_coreutil`) via libloading — compiles here, but the XRT call path is
# WRITE-BLIND (no Ryzen AI SDK/HW on this box) and validated on AMD NPU HW.
npu-ryzenai = ["dep:libloading"]
