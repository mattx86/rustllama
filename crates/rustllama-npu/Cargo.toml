[package]
name = "rustllama-npu"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Backend-agnostic NPU device model: enumeration, disable-by-index, fingerprint. Vendor runtimes (Intel OpenVINO / AMD Ryzen AI) plug in behind features."

[dependencies]
serde = { workspace = true }
tracing.workspace = true

[features]
default = []
# Intel NPU via the OpenVINO C API (Apache-2.0). REAL enumeration FFI
# (src/openvino.rs); build.rs links `openvino_c` from the SDK located via
# OPENVINO_DIR / INTEL_OPENVINO_DIR. Off by default so the normal build needs no
# SDK and stays toolchain-free. The offload/inference FFI lands with op-offload.
npu-openvino = []
# AMD NPU via the Ryzen AI / XRT stack. Same shape as npu-openvino; the FFI is a
# stub until a Ryzen AI SDK is available to compile-verify against.
npu-ryzenai = []
