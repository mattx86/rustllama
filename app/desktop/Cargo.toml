[package]
name = "rustllama"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rustllama — local LLM runtime for Intel (SYCL) + NVIDIA (CUDA) + CPU (CLI + server + native egui GUI)."
build = "build.rs"

[[bin]]
name = "rustllama"
path = "src/main.rs"

[features]
# All three compute backends — SYCL (Intel), CUDA (NVIDIA), CPU — are
# ALWAYS compiled into the binary; there are no `sycl`/`cuda` build
# features. Startup device detection selects which to run (or all).
# Building therefore always requires Intel oneAPI (`icx`/`icpx`) AND the
# CUDA Toolkit (`nvcc`). See the `rustllama-kernels-{sycl,cuda}` deps.
#
# encoder/history/tree-sitter default ON: plain builds and the shipped
# GUI binary are unchanged. `scripts\build-slim-server.bat` passes
# `--no-default-features` to drop them (server-only deployment: no
# quantizer tables, no bundled sqlite, no tree-sitter grammars, no GUI).
default = ["encoder", "history", "tree-sitter", "tui"]
# `rustllama quantize` + the GUI's quantize page.
encoder = ["rustllama-gguf/encoder", "rustllama-cli/encoder"]
# Conversation-history sqlite store (GUI Chat sidebar, `rustllama conv`).
history = ["rustllama-cli/history"]
# Code-aware RAG chunking grammars.
tree-sitter = ["rustllama-cli/tree-sitter"]
# Full-screen chat TUI (`rustllama chat --tui`; ratatui + crossterm).
tui = ["rustllama-cli/tui"]
# Enables the native egui GUI subcommand (`rustllama gui`). Implies
# `encoder`: the GUI's quantize page drives the gguf encode pipeline
# directly. Toolchain-free at the GUI layer — no Node/frontend build.
gui = ["encoder", "dep:rustllama-gui"]

[dependencies]
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustllama-cli = { path = "../../crates/rustllama-cli", default-features = false }
rustllama-runtime = { path = "../../crates/rustllama-runtime" }
# The GUI's quantize page drives the gguf encode pipeline directly.
rustllama-gguf = { path = "../../crates/rustllama-gguf", default-features = false }
# Used directly by `run_gui` for the startup SYCL device-probe log
# (so the user can see "GPU detected: ... driver_ver ... vram_mb"
# the moment the GUI process boots). Real-only, always compiled —
# requires Intel oneAPI (`icx`/`icpx`) at build time.
rustllama-kernels-sycl = { path = "../../crates/rustllama-kernels-sycl", default-features = false }
# NVIDIA CUDA compute kernels — real-only, always compiled into the
# binary (needs the CUDA Toolkit `nvcc` at build time; only the NVIDIA
# driver at runtime, since the kernels + static cudart are linked in).
rustllama-kernels-cuda = { path = "../../crates/rustllama-kernels-cuda" }

# Native egui/eframe GUI. Gated behind feature `gui` and toolchain-free at
# the GUI layer (eframe + rustllama-client only) — needs no Node/frontend
# build. `run_gui()` spawns the embedded server, then hands off to
# `rustllama_gui::run_ui()`.
rustllama-gui = { path = "../../crates/rustllama-gui", optional = true }
